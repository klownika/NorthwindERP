<div class="stack">
  <div class="fgroup" style="max-width: 420px">
    <label for="clq" class="lbl">Buscar cliente</label>
    <input id="clq" class="field" [(ngModel)]="q" placeholder="Nombre, ciudad o país" />
  </div>
  <app-load-state [loading]="load.loading()" [error]="load.error()" />
  <app-pager [pager]="pager" />
  <div class="table-box">
    <div style="min-width: 900px">
      <div class="thr" [style.grid-template-columns]="cols">
        <div>ID</div><div>Cliente</div><div>Contacto</div><div>Ciudad</div><div>País</div><div class="r">Pedidos</div><div></div>
      </div>
      @for (c of pager.rows(); track c.customerId) {
        <div class="tr" [style.grid-template-columns]="cols">
          <div class="muted">{{ c.customerId }}</div><div class="sb">{{ c.customerName }}</div><div>{{ c.contactName }}</div>
          <div>{{ c.city }}</div><div>{{ c.country }}</div><div class="r">{{ c.orders }}</div>
          <div><a class="linkbtn" [routerLink]="['/ventas/clientes', c.customerId]">Ver ficha</a></div>
        </div>
      } @empty {
        @if (!load.loading()) { <div class="empty">No hay clientes con ese filtro.</div> }
      }
    </div>
  </div>
</div>

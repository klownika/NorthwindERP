<div class="stack">
  <div class="fgroup" style="max-width: 420px">
    <label for="clq" class="lbl">Buscar cliente</label>
    <input id="clq" class="field" [(ngModel)]="q" placeholder="Nombre, ciudad o país" />
  </div>
  <app-load-state [loading]="load.loading()" [error]="load.error()" />
  <app-pager [pager]="pager" />
  <div class="table-box responsive">
    <div style="min-width: 850px">
      <div class="thr" [style.grid-template-columns]="cols">
        <div>ID</div><div>Cliente</div><div>Contacto</div><div>Ciudad</div><div>País</div><div class="r">Pedidos</div><div class="r">Acciones</div>
      </div>
      @for (c of pager.rows(); track c.customerId) {
        <div class="tr" [style.grid-template-columns]="cols">
          <div class="muted" data-label="ID">{{ c.customerId }}</div>
          <div class="sb" data-label="Cliente">{{ c.customerName }}</div>
          <div data-label="Contacto">{{ c.contactName ?? '—' }}</div>
          <div data-label="Ciudad">{{ c.city ?? '—' }}</div>
          <div data-label="País">{{ c.country ?? '—' }}</div>
          <div class="r" data-label="Pedidos">{{ c.orders }}</div>
          <div class="cell-actions">
            <a class="rowbtn" [routerLink]="['/ventas/clientes', c.customerId]" [attr.aria-label]="'Ver ficha de ' + c.customerName" title="Ver ficha"><app-icon name="eye" [size]="18" /></a>
            <a class="rowbtn" routerLink="/ventas/nuevo-pedido" [queryParams]="{ customerId: c.customerId }" [attr.aria-label]="'Nuevo pedido para ' + c.customerName" title="Nuevo pedido"><app-icon name="plus" [size]="18" /></a>
          </div>
        </div>
      } @empty {
        @if (!load.loading()) { <div class="empty">No hay clientes con ese filtro.</div> }
      }
    </div>
  </div>
</div>

<app-drawer [open]="detailOpen()" label="Ficha del cliente" closeTo="/ventas/clientes">
  <router-outlet (activate)="detailOpen.set(true)" (deactivate)="detailOpen.set(false)" />
</app-drawer>

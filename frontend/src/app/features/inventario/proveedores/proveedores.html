<div class="stack">
  <div class="filters">
    <div class="fgroup" style="flex: 1 1 260px; max-width: 420px">
      <label for="pq" class="lbl">Buscar proveedor</label>
      <input id="pq" class="field" [(ngModel)]="q" placeholder="Nombre, ciudad o país" />
    </div>
    <div class="fgroup" style="flex: 0 1 220px">
      <label for="pc" class="lbl">País</label>
      <app-combobox inputId="pc" [options]="countryOpts()" emptyLabel="Todos los países" emptyValue=""
                    [ngModel]="country()" (ngModelChange)="setCountry($event)" />
    </div>
    <div class="fgroup" style="flex: 0 1 220px">
      <label for="pci" class="lbl">Ciudad</label>
      <app-combobox inputId="pci" [options]="cityOpts()" [emptyLabel]="country() ? 'Todas las ciudades' : null" emptyValue=""
                    placeholder="Elige un país primero" [disabled]="!country()" [ngModel]="city()" (ngModelChange)="city.set($event)" />
    </div>
    <button type="button" class="ghost" style="min-height: 44px" [disabled]="!hasFilters()" (click)="clearFilters()">Limpiar filtros</button>
  </div>
  <app-load-state [loading]="load.loading()" [error]="load.error()" />
  <app-pager [pager]="pager" />
  <div class="table-box">
    <div style="min-width: 900px">
      <div class="thr" [style.grid-template-columns]="cols">
        <div>Proveedor</div><div>Contacto</div><div>Ciudad</div><div>País</div><div>Teléfono</div><div class="r">Productos</div>
      </div>
      @for (s of pager.rows(); track s.supplierId) {
        <div class="tr" [style.grid-template-columns]="cols">
          <div class="sb">{{ s.supplierName }}</div><div>{{ s.contactName }}</div><div>{{ s.city }}</div>
          <div>{{ s.country }}</div><div>{{ s.phone }}</div><div class="r b">{{ s.products }}</div>
        </div>
      } @empty {
        @if (!load.loading()) { <div class="empty">No hay proveedores con ese filtro.</div> }
      }
    </div>
  </div>
</div>

<app-catalog-browser [products]="products()" [categories]="categories()" [stock]="stock()" [warehouseId]="wh()"
                     [loading]="load.loading()" [(query)]="q">
  <div filters class="fgroup" style="flex: 0 1 260px">
    <label for="cw" class="lbl">Stock mostrado</label>
    <app-combobox inputId="cw" [options]="whOpts()" emptyLabel="Todos los almacenes" [emptyValue]="0" [ngModel]="wh()" (ngModelChange)="wh.set($event)" />
  </div>
  <app-load-state [loading]="load.loading()" [error]="load.error()" />
</app-catalog-browser>
